services:
  db:
    image: postgres:16
    container_name: pactelle-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: pactelle_user
      POSTGRES_PASSWORD: pactelle_dev_password
      POSTGRES_DB: pactelle_db

    ports:
    - "5434:5432"

    volumes:
      - pactelle_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactelle_user -d pactelle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pactelle_postgres_data: